<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Analytics Student Survey</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
</head>
<body class="container">
    <section>
        <h1 class="mb-4 text-center"> Business Analytics Student Survey</h1>
        <form action="edzaputil_ty.html" method="get">

            <div class="form-check">
            <p>I am fininshing my</p>
            <p><input type="radio" id="first" name="year" value="first" class="form-check-input" required>
            <label for="first" class="form-check-label">first year at Iowa</label></p>
            <p><input type="radio" id="second" name="year" value="second" class="form-check-input">
            <label for="second" class="form-check-label">second year at Iowa</label></p>
            <p><input type="radio" id="third" name="year" value="third" class="form-check-input">
            <label for="third" class="form-check-label">third year at Iowa</label></p>
            <p><input type="radio" id="fourth" name="year" value="fourth" class="form-check-input">
            <label for="fourth" class="form-check-label">fourth year at Iowa</label></p>
            <p><input type="radio" id="fifth" name="year" value="fifth" class="form-check-input">
            <label for="fifth" class="form-check-label">fifth or more year at Iowa</label></p>
            </div>

            <div class="form-check">
            <p> BAIS core classes I have completed </p>
            <p> <input type="checkbox" id="info-systems" name="core-classes" value="info-systems" class="form-check-input" required>
            <label for="info-systems" class="form-check-label">Information Systems</label></p>
            <p> <input type="checkbox" id="operations" name="core-classes" value="operations" class="form-check-input">
            <label for="operations" class="form-check-label">Operations Management</label></p>
            <p> <input type="checkbox" id="foundations" name="core-classes" value="foundations" class="form-check-input">
            <label for="foundations" class="form-check-label">Foundations of Business Analytics</label></p>
            <p> <input type="checkbox" id="comp" name="core-classes" value="comp" class="form-check-input">
            <label for="comp" class="form-check-label">Computational Thinking</label></p>
            <p> <input type="checkbox" id="database" name="core-classes" value="database" class="form-check-input">
            <label for="database" class="form-check-label">Database Management</label></p>
            <p> <input type="checkbox" id="wrangling" name="core-classes" value="wrangling" class="form-check-input">
            <label for="wrangling" class="form-check-label">Data Wrangling</label></p>
            <p> <input type="checkbox" id="mining" name="core-classes" value="mining" class="form-check-input">
            <label for="mining" class="form-check-label">Data Mining</label></p>
            <p> <input type="checkbox" id="capstone" name="core-classes" value="capstone" class="form-check-input">
            <label for="capstone" class="form-check-label">BAIS Capstone</label></p>
            </div>

        <p><button class="btn btn-primary" type="submit">Finish</button></p>
        </form>
    </section>
    <footer class="mt-auto text-center">
        page 2 of 2
    </footer>

    <!-- Separate Popper and Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
</body>
</html>
