<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Analytics Student Survey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <h1> Business Analytics Student Survey</h1>
        <form action="edzaputil_ty.html" method="get">
            <p>I am fininshing my</p>
            <p><input type="radio" id="first" name="year" value="first" required>
            <label for="first">first year at Iowa</label></p>
            <p><input type="radio" id="second" name="year" value="second">
            <label for="second">second year at Iowa</label></p>
            <p><input type="radio" id="third" name="year" value="third">
            <label for="third">third year at Iowa</label></p>
            <p><input type="radio" id="fourth" name="year" value="fourth">
            <label for="fourth">fourth year at Iowa</label></p>
            <p><input type="radio" id="fifth" name="year" value="fifth">
            <label for="fifth">fifth or more year at Iowa</label></p>

            <p> BAIS core classes I have completed </p>
            <p> <input type="checkbox" id="info-systems" name="core-classes" value="info-systems" required>
            <label for="info-systems">Information Systems</label></p>
            <p> <input type="checkbox" id="operations" name="core-classes" value="operations">
            <label for="operations">Operations Management</label></p>
            <p> <input type="checkbox" id="foundations" name="core-classes" value="foundations">
            <label for="foundations">Foundations of Business Analytics</label></p>
            <p> <input type="checkbox" id="comp" name="core-classes" value="comp">
            <label for="comp">Computational Thinking</label></p>
            <p> <input type="checkbox" id="database" name="core-classes" value="database">
            <label for="database">Database Management</label></p>
            <p> <input type="checkbox" id="wrangling" name="core-classes" value="wrangling">
            <label for="wrangling">Data Wrangling</label></p>
            <p> <input type="checkbox" id="mining" name="core-classes" value="mining">
            <label for="mining">Data Mining</label></p>
            <p> <input type="checkbox" id="capstone" name="core-classes" value="capstone">
            <label for="capstone">BAIS Capstone</label></p>

        <p><button type="submit">Finish</button></p>
        </form>
    </section>
    <footer>
        page 2 of 2
    </footer>
</body>
</html>
